name: Build Custom Nuvio TV APK

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - 'app/**'
      - '.github/workflows/build-custom-tv-apk.yml'

permissions:
  contents: write

jobs:
  build:
    name: Build Android TV Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Generate Release Keystore and Local Properties
        run: |
          gh release delete v1.1.0 --yes --repo "${{ github.repository }}" || true
          git tag -d v1.1.0 || true
          git push origin :refs/tags/v1.1.0 || true
          gh release create v1.1.0 dist/*.apk \
            --title "Nuvio TV Custom v1.1.0 (Juansher)" \
            --notes "Versión personalizada de Nuvio Android TV v1.1.0 para Smart TV y TV Box.

### Novedades y correcciones en v1.1.0:
- Indicador de enlace activo: El panel lateral de fuentes ahora identifica y resalta siempre con la etiqueta 'Reproduciendo' y borde iluminado el enlace en uso, incluyendo streams de Real-Debrid y AIOStreams.
- Auto-scroll a la fuente en reproducción: Al abrir el panel de fuentes, la lista se desplaza automáticamente hasta la fuente activa para que aparezca en pantalla.
- Corrección en películas: Se corrigió la consulta de fuentes en películas para utilizar siempre el identificador IMDb, garantizando la lista completa de resultados de torrents/debrid.
- Filtro Regex de idioma: Cancela la reproducción automática si no hay audio en español y muestra la lista de streams disponibles.
- Autenticación oficial: Supabase, TMDB, Trakt, Simkl, MDBList con servidores oficiales.
- Identificador de versión: Juansher | V1.1.0." \
            --repo "${{ github.repository }}"
